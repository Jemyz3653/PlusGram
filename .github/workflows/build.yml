name: Build PlusGram

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABIs to build (comma separated)'
        default: 'arm64-v8a'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      PLUS_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
      PLUS_API_ID: ${{ secrets.PLUS_API_ID }}
      PLUS_API_HASH: ${{ secrets.PLUS_API_HASH }}
      PLUS_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1" > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Check api keys
        run: |
          if [ -z "$PLUS_API_ID" ] || [ -z "$PLUS_API_HASH" ]; then
            echo "::warning::Secrets PLUS_API_ID / PLUS_API_HASH are not set - the APK will build, but login will not work."
          fi

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ env.PLUS_ABIS }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ env.PLUS_ABIS }}-

      - name: Decode signing key
        env:
          PLUS_KEYSTORE_BASE64: ${{ secrets.PLUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLUS_KEYSTORE_BASE64" ]; then
            echo "$PLUS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plusgram.keystore"
            echo "PLUS_KEYSTORE_FILE=$RUNNER_TEMP/plusgram.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No PLUS_KEYSTORE_BASE64 secret - signing with the public test key."
          fi

      - name: Compile Java (fast check)
        run: |
          set -o pipefail
          ./gradlew --no-daemon -PPLUS_ABIS="$PLUS_ABIS" :TMessagesProj:compileReleaseJavaWithJavac --stacktrace 2>&1 | tee build-java.log

      - name: Build release APK
        env:
          PLUS_KEYSTORE_PASSWORD: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
          # optional: alias defaults to "plusgram", key password to the keystore password (PKCS12)
          PLUS_KEY_ALIAS: ${{ secrets.PLUS_KEY_ALIAS || 'plusgram' }}
          PLUS_KEY_PASSWORD: ${{ secrets.PLUS_KEY_PASSWORD || secrets.PLUS_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ccache -z || true
          ./gradlew --no-daemon -PPLUS_ABIS="$PLUS_ABIS" :TMessagesProj_App:assembleAfatRelease --stacktrace 2>&1 | tee build-apk.log
          ccache -s || true

      - name: Collect APK
        run: |
          mkdir -p dist
          find TMessagesProj_App/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      - name: Report APK
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          for apk in dist/*.apk; do
            badging=$("$AAPT2" dump badging "$apk" 2>/dev/null | grep -E "^(package|application-label:|native-code|sdkVersion|targetSdkVersion)" | tr '\n' ' ')
            size=$(du -h "$apk" | cut -f1)
            echo "::notice title=APK $(basename "$apk") ($size)::$badging"
          done
          keys="missing"; [ -n "$PLUS_API_ID" ] && [ -n "$PLUS_API_HASH" ] && keys="set"
          signing="test key"; [ -n "$PLUS_KEYSTORE_FILE" ] && signing="own key"
          echo "::notice title=Build config::api keys: $keys, signing: $signing, abis: $PLUS_ABIS"

      - name: Report errors
        if: failure()
        run: |
          for f in build-java.log build-apk.log; do
            [ -f "$f" ] || continue
            grep -nE "error:|FAILURE:|What went wrong|Execution failed|> .*Exception|ninja: build stopped" "$f" | head -40 | while IFS= read -r line; do
              echo "::error title=$f::${line:0:900}"
            done
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlusGram-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra=""
          case "$GITHUB_REF_NAME" in *-*) extra="--prerelease";; esac
          notes="PlusGram ${GITHUB_REF_NAME}"
          [ -z "$PLUS_API_ID" ] && notes="$notes - preview build without api keys: the app opens, but login does not work."
          # release may already exist when it was created from the GitHub website
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.apk --title "PlusGram ${GITHUB_REF_NAME}" --notes "$notes" $extra
          fi
