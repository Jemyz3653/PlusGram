name: Build PlusGram

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABIs to build (comma separated)'
        default: 'arm64-v8a'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      PLUS_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
      PLUS_API_ID: ${{ secrets.PLUS_API_ID }}
      PLUS_API_HASH: ${{ secrets.PLUS_API_HASH }}
      PLUS_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1" > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Check api keys
        run: |
          if [ -z "$PLUS_API_ID" ] || [ -z "$PLUS_API_HASH" ]; then
            echo "::warning::Secrets PLUS_API_ID / PLUS_API_HASH are not set - the APK will build, but login will not work."
          fi

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ env.PLUS_ABIS }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ env.PLUS_ABIS }}-

      - name: Decode signing key
        env:
          PLUS_KEYSTORE_BASE64: ${{ secrets.PLUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLUS_KEYSTORE_BASE64" ]; then
            echo "$PLUS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plusgram.keystore"
            echo "PLUS_KEYSTORE_FILE=$RUNNER_TEMP/plusgram.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No PLUS_KEYSTORE_BASE64 secret - signing with the public test key."
          fi

      - name: Compile Java (fast check)
        run: ./gradlew --no-daemon -PPLUS_ABIS="$PLUS_ABIS" :TMessagesProj:compileReleaseJavaWithJavac --stacktrace

      - name: Build release APK
        env:
          PLUS_KEYSTORE_PASSWORD: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
          PLUS_KEY_ALIAS: ${{ secrets.PLUS_KEY_ALIAS }}
          PLUS_KEY_PASSWORD: ${{ secrets.PLUS_KEY_PASSWORD }}
        run: |
          ccache -z || true
          ./gradlew --no-daemon -PPLUS_ABIS="$PLUS_ABIS" :TMessagesProj_App:assembleAfatRelease --stacktrace
          ccache -s || true

      - name: Collect APK
        run: |
          mkdir -p dist
          find TMessagesProj_App/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlusGram-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk --title "PlusGram ${GITHUB_REF_NAME}" --generate-notes
